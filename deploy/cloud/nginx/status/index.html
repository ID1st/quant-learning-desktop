<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>量化学习系统</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #0d1117;
        color: #d8dee9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(520px, 100%);
        border: 1px solid #273142;
        background: #111821;
        padding: 28px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #96a2b4;
        font-size: 14px;
        line-height: 1.7;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 24px;
        color: #9cc9ad;
        font-size: 13px;
      }
      .status::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4f9d69;
        content: "";
      }
    </style>
  </head>
  <body>
    <main>
      <h1>量化学习系统</h1>
      <p>此域名用于桌面客户端账号认证，暂不提供网页操作入口。</p>
      <div class="status" role="status">服务入口已配置</div>
    </main>
  </body>
</html>
