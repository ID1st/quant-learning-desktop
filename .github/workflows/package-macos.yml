name: Package desktop internal

on:
  workflow_dispatch:
  push:
    branches:
      - codex/package-macos

permissions:
  contents: write

jobs:
  package-macos:
    name: Package macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      QUANT_DESKTOP_RELEASE_DIR: ${{ github.workspace }}/outputs/macos-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11.12.1
      - name: Install dependencies
        run: npm ci
      - name: Verify release configuration
        run: npm run test:release
      - name: Package DMG
        run: npm run package:internal:mac:${{ matrix.arch }} -w @quant/desktop
      - name: Verify artifact
        run: |
          artifacts=("$QUANT_DESKTOP_RELEASE_DIR"/*-mac-${{ matrix.arch }}.dmg)
          apps=("$QUANT_DESKTOP_RELEASE_DIR"/mac*/量化学习桌面版.app)
          test "${#artifacts[@]}" -eq 1
          test "${#apps[@]}" -eq 1
          binding="${apps[0]}"/Contents/Resources/app.asar.unpacked/node_modules/longbridge-darwin-${{ matrix.arch }}/longbridge.darwin-${{ matrix.arch }}.node
          test -f "$binding" || {
            echo "Missing macOS native binding: $binding"
            echo "The app would crash at launch with 'Cannot find native binding'."
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          signature_details=$(codesign --display --verbose=4 "${apps[0]}" 2>&1)
          echo "$signature_details"
          grep -q "Signature=adhoc" <<<"$signature_details"
          hdiutil verify "${artifacts[0]}"
          shasum -a 256 "${artifacts[0]}"
      - name: Launch packaged renderer smoke test
        run: |
          app=("$QUANT_DESKTOP_RELEASE_DIR"/mac*/量化学习桌面版.app)
          smoke_root=$(mktemp -d "${TMPDIR%/}/quant-renderer-smoke.XXXXXX")
          export QUANT_RELEASE_SMOKE_USER_DATA="$smoke_root/user-data"
          smoke_log="$smoke_root/renderer-smoke.log"
          export QUANT_RENDERER_SMOKE_RESULT="$smoke_root/renderer-smoke.json"
          open -W -n "${app[0]}" --args \
            --packaged-renderer-smoke \
            "--packaged-renderer-smoke-result=$QUANT_RENDERER_SMOKE_RESULT" \
            "--release-smoke-user-data=$QUANT_RELEASE_SMOKE_USER_DATA" \
            >"$smoke_log" 2>&1 &
          smoke_pid=$!
          smoke_ok=false
          for _ in {1..40}; do
            if grep -q '"ok":true' "$QUANT_RENDERER_SMOKE_RESULT" 2>/dev/null; then
              smoke_ok=true
              break
            fi
            kill -0 "$smoke_pid" 2>/dev/null || break
            sleep 1
          done
          if test "$smoke_ok" != true; then
            app_pid=$(pgrep -f '量化学习桌面版.app/Contents/MacOS' | tail -n 1 || true)
            ps -axww | grep -E '量化学习桌面版|Electron' | grep -v grep || true
            if test -n "$app_pid"; then
              sample "$app_pid" 3 1 || true
            fi
          fi
          kill "$smoke_pid" 2>/dev/null || true
          wait "$smoke_pid" 2>/dev/null || true
          cat "$smoke_log"
          ls -la "$smoke_root"
          cat "$QUANT_RENDERER_SMOKE_RESULT" 2>/dev/null || true
          find "$HOME/Library/Logs" -maxdepth 5 -type f -name 'main.log' \
            -exec sh -c 'echo "--- $1"; tail -n 100 "$1"' _ {} \; 2>/dev/null || true
          test "$smoke_ok" = true
      - name: Upload quant-learning-desktop-mac-${{ matrix.arch }} to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload codex-internal-v0.1.7 "$QUANT_DESKTOP_RELEASE_DIR"/*.dmg --clobber

  package-windows:
    name: Package Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      QUANT_DESKTOP_RELEASE_DIR: ${{ github.workspace }}\outputs\windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11.12.1
      - name: Install dependencies
        run: npm ci
      - name: Verify release configuration
        run: npm run test:release
      - name: Package EXE
        run: npm run package:internal:win:x64 -w @quant/desktop
      - name: Verify artifact is unsigned
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -LiteralPath $env:QUANT_DESKTOP_RELEASE_DIR -Filter '*-win-x64.exe' -File)
          if ($artifacts.Count -ne 1) { throw "Expected one Windows installer, found $($artifacts.Count)." }
          $signature = Get-AuthenticodeSignature -LiteralPath $artifacts[0].FullName
          if ($signature.Status -ne 'NotSigned') { throw "Expected unsigned installer, got $($signature.Status)." }
          Get-FileHash -Algorithm SHA256 -LiteralPath $artifacts[0].FullName
      - name: Upload quant-learning-desktop-windows-x64 to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload codex-internal-v0.1.7 "$env:QUANT_DESKTOP_RELEASE_DIR\quant-learning-desktop-0.1.7-win-x64.exe" --clobber
